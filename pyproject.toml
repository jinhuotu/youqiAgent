[tool.poetry]
name = "agent-ai-service"
version = "1.0.0"
description = "内部 AI 能力下沉服务 - 面向 Java 业务后端的大模型对话与智能体能力"
authors = ["AI Service Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
langchain = "^1.0.0"
langchain-core = "^1.0.0"
langchain-community = "^0.3.0"
langchain-openai = "^0.3.0"
langchain-ollama = "^0.3.0"
langgraph = "^1.0.0"
sqlalchemy = "^2.0.36"
pymysql = "^1.1.1"
cryptography = "^44.0.0"
alembic = "^1.14.0"
chromadb = "^1.0.0"
redis = "^5.2.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
python-dotenv = "^1.0.1"
python-multipart = "^0.0.20"
loguru = "^0.7.3"
httpx = "^0.28.0"
tiktoken = "^0.8.0"
sse-starlette = "^2.2.0"
pypdf = "^5.0.0"
python-docx = "^1.1.0"
openpyxl = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.9.0"

[tool.poetry.scripts]
start = "app.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
