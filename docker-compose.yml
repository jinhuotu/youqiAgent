# youqiAgent 本地 / 阿里云 Ubuntu 通用编排
# 用法：
#   Windows:  copy .env.docker.example .env.docker  &&  docker compose --env-file .env.docker up -d --build
#   Ubuntu:   DATA_ROOT=/opt/youqiAgent/data 写入 .env.docker 后同上
#
# 对外仅暴露 nginx :8091；后端 api 不映射宿主机端口。

name: youqiagent

services:
  mysql:
    image: ${MYSQL_IMAGE:-docker.1ms.run/library/mysql:8.0}
    container_name: youqi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_ai}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ${DATA_ROOT:-./data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - youqi-net

  redis:
    image: ${REDIS_IMAGE:-docker.1ms.run/library/redis:7-alpine}
    container_name: youqi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - youqi-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.1ms.run/library/python:3.12.5-slim-bookworm}
        NODE_VERSION: ${NODE_VERSION:-20.18.1}
        NODE_SHA256: ${NODE_SHA256:-c6fa75c841cbffac851678a472f2a5bd612fff8308ef39236190e1f8dbb0e567}
    image: youqiagent-api:local
    container_name: youqi-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_ai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      CHROMA_PERSIST_PATH: /app/data/chroma
      UPLOAD_ROOT: /app/data/uploads
      MCP_WORKDIR: /app/data/mcp
      TZ: Asia/Shanghai
    volumes:
      - ${DATA_ROOT:-./data}/chroma:/app/data/chroma
      - ${DATA_ROOT:-./data}/uploads:/app/data/uploads
      - ${DATA_ROOT:-./data}/mcp:/app/data/mcp
      - ${DATA_ROOT:-./data}/logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - youqi-net

  web:
    build:
      context: ../youqiAgent-web
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/library/node:20-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.1ms.run/library/nginx:1.27-alpine}
        VITE_API_BASE_URL: same-origin
    image: youqiagent-web:local
    container_name: youqi-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8091}:80"
    networks:
      - youqi-net

networks:
  youqi-net:
    driver: bridge
